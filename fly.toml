# Fly.io app config. Creating the Fly app and setting secrets is Alan's step.
# The name below is a placeholder; change it if fly.io says it is taken.
# Do not put Stripe keys, SESSION_SECRET, or database URLs in this file.

app = "adel-service"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  ADEL_SERVER = "1"
  PORT = "3000"
  STORAGE_DRIVER = "s3"
  S3_FORCE_PATH_STYLE = "false"
  RUN_MIGRATIONS = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[deploy]
  release_command = "node packages/db/migrate.mjs"
