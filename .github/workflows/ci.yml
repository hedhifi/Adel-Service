name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adel
          POSTGRES_PASSWORD: adel
          POSTGRES_DB: adel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adel -d adel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://adel:adel@localhost:5432/adel_test
      SESSION_SECRET: ci-session-secret-value
      BCRYPT_ROUNDS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
        env:
          DATABASE_URL: postgres://adel:adel@localhost:5432/adel_test
          SESSION_SECRET: ci-session-secret-value
          APP_URL: http://localhost:3000
