# Local Postgres for `pnpm dev` and tests. The hosted stack is docker-compose.prod.yml.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: adel
      POSTGRES_PASSWORD: adel
      POSTGRES_DB: adel
    ports:
      - "5432:5432"
    volumes:
      - adel_pg:/var/lib/postgresql/data
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/01-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adel -d adel"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  adel_pg:
